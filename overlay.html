<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Alpha Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    video {
      width: 100vw;
      height: 100vh;
      display: block;
      background: transparent;
      pointer-events: none;
    }

    /* Edit mode: visible frame + draggable body. Edges still resize natively. */
    body.edit {
      -webkit-app-region: drag;
      background: rgba(128, 128, 128, 0.18);
      box-shadow: inset 0 0 0 2px rgba(0, 150, 255, 0.95);
      cursor: move;
    }
    #hint {
      display: none;
      position: fixed;
      left: 8px;
      bottom: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      font: 12px -apple-system, system-ui, sans-serif;
      color: #fff;
      background: rgba(0, 120, 220, 0.9);
      pointer-events: none;
    }
    body.edit #hint { display: block; }

    /* Non-draggable strips along each edge so the OS resize handles get the mouse. */
    .edge {
      display: none;
      position: fixed;
      -webkit-app-region: no-drag;
    }
    body.edit .edge { display: block; }
    #eT { top: 0; left: 0; right: 0; height: 10px; cursor: ns-resize; }
    #eB { bottom: 0; left: 0; right: 0; height: 10px; cursor: ns-resize; }
    #eL { left: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
    #eR { right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline></video>
  <div class="edge" id="eT"></div>
  <div class="edge" id="eB"></div>
  <div class="edge" id="eL"></div>
  <div class="edge" id="eR"></div>
  <div id="hint">Drag to move &middot; drag edges to resize &middot; Cmd+Shift+E to lock</div>
  <script>
    const params = new URLSearchParams(location.search);
    const v = document.getElementById('v');
    v.muted = params.get('muted') === '1';
    v.volume = Math.min(1, Math.max(0, parseFloat(params.get('volume') || '1')));
    v.src = params.get('src');
    v.style.objectFit = params.get('fit') || 'contain';
    v.style.opacity = params.get('opacity') || '1';
    // Black lines are invisible over dark apps; --invert flips them to white.
    if (params.get('invert') === '1') v.style.filter = 'invert(1)';
    v.loop = params.get('loop') === '1';
    // Play once, then clear the last frame off the screen (Cmd+Shift+R replays).
    v.addEventListener('ended', () => { if (!v.loop) v.style.visibility = 'hidden'; });
    v.play().catch((e) => console.error('play failed', e));
  </script>
</body>
</html>
